name: Build Quill Docker image
run-name: Build Quill Docker image for ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Quill version'
        required: true
        type: string
      docker_user:
        description: 'DockerHub username'
        required: false
        type: string
        default: ravendb
      docker_repo:
        description: 'DockerHub repository'
        required: false
        type: string
        default: ravendb/quill
      github_repository:
        description: 'Github repository'
        required: false
        type: string
        default: ravendb/ravendb
      github_ref:
        description: 'Git ref of github_repository to build from'
        required: false
        type: string
        default: feature/ai-appliance
      push_latest_tags:
        description: 'Also push :latest and :<minor>-latest floating tags'
        required: false
        type: boolean
        default: true
      payload_base_url:
        description: 'Base URL of the pre-built Quill payloads (TeamCity uploads Quill-<version>-<arch>.tar.bz2 here via s3uploader.sh)'
        required: false
        type: string
        default: 'https://daily-builds.s3.amazonaws.com'
      dry_run:
        description: 'Dry run - build locally, skip login/push'
        required: false
        type: string
        default: ''

env:
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64v8
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout ${{ inputs.github_repository }}@${{ inputs.github_ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.github_repository }}
          ref: ${{ inputs.github_ref }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.dry_run == '' }}
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: docker login -u ${{ inputs.docker_user }} -p "$DOCKER_HUB_PASSWORD"

      - name: Build & push per-arch image
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            amd64)   RID_ARCH=linux-x64 ;;
            arm64v8) RID_ARCH=linux-arm64 ;;
            *) echo "unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          PAYLOAD="artifacts/Quill-${{ inputs.version }}-${RID_ARCH}.tar.bz2"
          mkdir -p artifacts
          wget -O "$PAYLOAD" "${{ inputs.payload_base_url }}/Quill-${{ inputs.version }}-${RID_ARCH}.tar.bz2"

          ARGS=(
            --platform "${{ matrix.platform }}"
            --payload  "$PAYLOAD"
            --tag      "${{ inputs.docker_repo }}:${{ inputs.version }}-${{ matrix.arch }}"
          )
          if [ -n "$DRY_RUN" ]; then ARGS+=(--dry-run); else ARGS+=(--push); fi

          ./docker/quill/scripts/build.sh "${ARGS[@]}"

      - name: Docker logout
        if: ${{ always() && inputs.dry_run == '' }}
        run: docker logout || true

  multiarch:
    name: Create multiarch manifest
    needs: build
    if: ${{ inputs.dry_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: docker login -u ${{ inputs.docker_user }} -p "$DOCKER_HUB_PASSWORD"

      - name: Create multiarch manifest
        shell: bash
        run: |
          REPO="${{ inputs.docker_repo }}"
          VERSION="${{ inputs.version }}"
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          # The two per-arch tags each build job just pushed.
          AMD64="$REPO:$VERSION-amd64"
          ARM64="$REPO:$VERSION-arm64v8"

          # Stitch them into a manifest published under the pinned version tag.
          docker buildx imagetools create --tag "$REPO:$VERSION" "$AMD64" "$ARM64"

          if [ "${{ inputs.push_latest_tags }}" = "true" ]; then
            docker buildx imagetools create --tag "$REPO:$MINOR-latest" "$AMD64" "$ARM64"
            docker buildx imagetools create --tag "$REPO:latest"        "$AMD64" "$ARM64"
          fi

      - name: Docker logout
        if: always()
        run: docker logout || true
